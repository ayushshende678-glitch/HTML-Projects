<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>university registration form</title>
</head>
<body>
    <h1 style="color: rgb(60, 70, 70);">University Registration Form</h1>
    <p>Please fill out the form below to register</p>
    <br>
    <hr>
    <br>
HTML CODES/admissionform.html
    <form>
        <h2>Personal Details</h2>
         <label for="name">First Name :</label>
         <input type="text" name="name" id="name" placeholder="e.g. Ayush" required>
         <br>
         <br>
         <label for="lname">Last Name :</label>
         <input type="text" name="name" id="lname"placeholder="e.g.Shende" required>
         <br>
         <br>
         <label for="DOB">Date Of Birth :</label>
         <input type="date" value="DOB" required>
         <br><br>
        <p>Gender :</p>
        <label for="Male">Male</label>
        <input type="radio" name="gender" id="Male" value="Male">

        <label for="Female">Female</label>
        <input type="radio" name="gender" id="Female" value="Female">
         
        <label for="Other">Other</label>
        <input type="radio" name="gender" id="Other" value="Other">
        <br>
        <br>
   
        <h3>Upload Your Photo :</h3>
        <input type="file" name="file">
        <br>
        <br>
        <h2>Contact Informaton</h2>
        <label for="Email">Email Address:</label>
        <input type="email" name="Email" id="Email" placeholder="e.g. emailid@gmail.com">
        <br><br>
        <label for="No"> Phone Number :</label>
        <input type="number" name="phone" id="No" placeholder="e.g. 8999454721">
        <br>
        <br>
        <label for="Address">Mailing Address :</label> 
        <br>
        <textarea name="Address" id="Address" rows="5" cols="30" placeholder="Street Address, City, State, Zip Code"></textarea>
        
        <br>
        <hr>
        <br>
        <br>

        <h3>Academic Information</h3>
        <label for="Course">Select your Course:</label>
        <select name="Course" id="Course">
            <br>
            <br>
            <option value="Select your Course">-- Choose a Course --</option>
            <option value="Cse">Cse</option>
            <option value="EE">EE</option>
            <option value="Cvil">Cvil</option>
        </select>
        <br><br>

        <label>Extracurricular Intrests: </label>
        <label for="Sport">Sport</label>
        <input type="checkbox" name="Sport" id="Sport" value="Sport">
        <br>
        <label for="Music">Music & Arts</label>
        <input type="checkbox" name="Music" id="Music" value="Music & Arts">
        <br>
        <label for="Technology">Technology Clubs</label>
        <input type="checkbox" name="Technology" id="Technology" value="Technology Clubs">
        <br>
        <label for="Volunteering">Volunteering</label>
        <input type="checkbox" name="Volunteering" id="Volunteering" value="Volunteering">
        <br><br>
        <hr>

        <h3>Create Your Account</h3>
        <label for="pass">Create a password</label>
        <input type="password" name="password" id="pass">
        <br><br>
        <label for="Security">Security Quetions: </label>
        <select name="Security" id="Security">
            <option value="Enter you pet name?">Enter you pet name?</option>
            <option value="Enter your place of birth?">Enter your place of birth?</option>
            <option value="Enter you Grandfather name?">Enter you Grandfather name?</option>
        </select> 
        <br><br>
        <label for="">answere security Quetions:</label>
        <input type="text" name="Security" id="Security">
        <br>
        <br>
        <input type="checkbox" name="I" id="I" value="I agree to the Terms and Conditions." required>
        <label for="I">I agree to the Terms and Conditions.</label>
        <br><br>
        <hr>
        <br>
        <input type="submit" value="Register">
        <input type="submit" value="Clear form">
    </form>
    <audio controls>
     <source src="Shakira, Burna Boy - Dai Dai (Official Video).mp3">    
    </audio>

     
</body>
</html>
